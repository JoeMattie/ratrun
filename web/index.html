<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No browser zoom of any kind: the game owns every pinch. viewport-fit lets
       the ink reach under the notch; the safe-area insets keep the grid clear
       of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Rat Run</title>
  <meta name="theme-color" content="#090a0d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rat Run">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #090a0d; color: #e1d8cc; font: 14px monospace;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    /* A fixed body stops iOS rubber-banding the whole document. */
    body { position: fixed; inset: 0; }
    /* Absolute children ignore an ancestor's padding box, so the safe area is
       applied to the terminal box itself: the notch and home bar keep their own
       ink and the grid never sits under them. */
    #terminal {
      position: absolute; inset: 0;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    #terminal:focus { outline: none; }
    #terminal canvas { position: absolute; top: 0; left: 0; }
    #status { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); }
    #restart { background: #090a0d; color: inherit; border: 1px solid; padding: .7rem 1rem; font: inherit; }
    /* Portrait on a touch device. The plate owns the screen until the phone
       turns; game.js stops the touch stream while it shows. */
    #portrait {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.3rem; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      box-sizing: border-box; background: #090a0d; text-align: center; letter-spacing: .16em;
    }
    #portrait[hidden] { display: none; }
    #portrait .rat { transform: rotate(90deg); opacity: .75; }
    #portrait .turn { margin: 0; font-size: 1.35rem; }
    #portrait .why { margin: 0; font-size: .8rem; opacity: .55; }
  </style>
</head>
<body>
  <main id="terminal" tabindex="0" aria-label="Rat Run">
    <canvas id="picture" aria-hidden="true"></canvas>
    <canvas id="text" aria-hidden="true"></canvas>
  </main>
  <div id="portrait" role="status" hidden>
    <svg class="rat" viewBox="0 0 44 26" width="132" height="78" aria-hidden="true">
      <g fill="none" stroke="#e1d8cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 14.5c-2.8 0-3.8 2.6-6.4 2.6"/>
        <ellipse cx="18.5" cy="13" rx="10" ry="5.6"/>
        <ellipse cx="29.6" cy="12" rx="5.2" ry="4.3"/>
        <circle cx="28.2" cy="7.2" r="2.5"/>
        <path d="M15.4 18.4v3.4M23.4 18.4v3.4"/>
        <path d="M35.2 11.6l4.6-1.6M35.2 13l4.6 1.6"/>
        <circle cx="32.2" cy="11" r="1.1" fill="#e1d8cc" stroke="none"/>
        <circle cx="34.8" cy="13.4" r="0.9" fill="#e1d8cc" stroke="none"/>
      </g>
    </svg>
    <p class="turn">TURN YOUR PHONE</p>
    <p class="why">THE SEWER IS WIDER THAN THIS</p>
  </div>
  <div id="status" role="status">LOADING</div>
  <script type="module" src="./game.js"></script>
</body>
</html>
