<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rat Run</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090a0d; }
    body { color: #e1d8cc; font: 14px monospace; }
    #terminal { position: absolute; inset: 0; overflow: hidden; }
    #terminal:focus { outline: none; }
    #terminal canvas { position: absolute; top: 0; left: 0; }
    #status { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); }
    #restart { background: #090a0d; color: inherit; border: 1px solid; padding: .7rem 1rem; font: inherit; }
  </style>
</head>
<body>
  <main id="terminal" tabindex="0" aria-label="Rat Run">
    <canvas id="picture" aria-hidden="true"></canvas>
    <canvas id="text" aria-hidden="true"></canvas>
  </main>
  <div id="status" role="status">LOADING</div>
  <script type="module" src="./game.js"></script>
</body>
</html>
