[package]
name = "ratrun"
version = "0.1.0"
edition = "2021"
description = "Rat Run — a terminal bullet-hell horde survivor built with ratatui"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
anyhow = "1"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rascii_art = "0.4.5"
image = "0.24" # must match rascii_art's image version so DynamicImage unifies
# ECS for the simulation port. Single-threaded determinism is required:
# default features (bevy_reflect, async_executor, backtrace, std) are off and
# only `std` is re-enabled; `multi_threaded` must stay off.
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1
