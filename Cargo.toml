[package]
name = "ratrun"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "Rat Run — a terminal bullet-hell horde survivor built with ratatui"

[features]
# The admin drop-down console. On by default in this development build; a
# release build can `--no-default-features` to compile it out entirely.
# `RATRUN_CONSOLE=0` also disables it at runtime.
default = ["console", "gamepad"]
console = []
# Gamepad support (wave 3 controls); see the optional `gilrs` dependency.
gamepad = ["dep:gilrs"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
anyhow = "1"
# Platform-independent maths for the simulation (`src/detmath.rs`). Rust's
# `f32::sin`/`cos`/`powf`/… forward to the platform maths library, whose
# last-bit rounding differs between macOS, Linux and Windows; `libm` is
# pure Rust and bit-identical everywhere, which is what the determinism
# goldens need. Already in the tree transitively, so no new download.
libm = "0.2"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rascii_art = "0.4.5"
image = "0.24" # must match rascii_art's image version so DynamicImage unifies
# ECS for the simulation port. Single-threaded determinism is required:
# default features (bevy_reflect, async_executor, backtrace, std) are off and
# only `std` is re-enabled; `multi_threaded` must stay off.
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
# Gamepad support (wave 3 controls). Optional so `--no-default-features` builds
# on a machine without libudev: gilrs needs it on Linux, nothing on macOS.
gilrs = { version = "0.11", optional = true }

# Terminal capability detection polls stdin with a short timeout when it asks
# the terminal for its keyboard protocol (see src/term.rs). Already in the tree
# through crossterm/signal-hook, so this adds no new download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1
